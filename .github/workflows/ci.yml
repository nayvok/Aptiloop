name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted CI policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: .trusted-policy
      - name: Check out source under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: source
      - name: Initialize supply-chain evidence directory
        working-directory: source
        run: |
          rm -rf -- .verify
          mkdir -p .verify/supply-chain
      - name: Verify pinned GitHub Actions
        working-directory: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          RUNNER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          node "$GITHUB_WORKSPACE/.trusted-policy/scripts/github-actions-policy.mjs"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --runner-workflow-commit "$RUNNER_WORKFLOW_COMMIT"
          --runner-workflow-ref "$RUNNER_WORKFLOW_REF"
          --repository "$REPOSITORY"
          --trusted-policy-root "$GITHUB_WORKSPACE/.trusted-policy"
          --output .verify/supply-chain/workflow-provenance.json
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@11.12.1
      - name: Install source dependencies without lifecycle scripts
        working-directory: source
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: npm ci --ignore-scripts
      - name: Classify npm audit findings with trusted policy
        working-directory: source
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: >-
          node "$GITHUB_WORKSPACE/.trusted-policy/scripts/npm-audit-policy.mjs"
          --output-dir .verify/supply-chain
      - name: Generate CycloneDX npm SBOM
        if: always()
        working-directory: source
        run: |
          mkdir -p .verify/supply-chain
          npm sbom --sbom-format=cyclonedx --workspaces --include-workspace-root --legacy-peer-deps > .verify/supply-chain/sbom.cdx.json
      - name: Validate exact supply-chain evidence
        id: validate-supply-chain-evidence
        if: always()
        working-directory: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          RUNNER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          node "$GITHUB_WORKSPACE/.trusted-policy/scripts/supply-chain-evidence-policy.mjs"
          --evidence-dir .verify/supply-chain
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --runner-workflow-commit "$RUNNER_WORKFLOW_COMMIT"
          --runner-workflow-ref "$RUNNER_WORKFLOW_REF"
          --repository "$REPOSITORY"
          --trusted-policy-root "$GITHUB_WORKSPACE/.trusted-policy"
      - name: Upload supply-chain provenance and reports
        if: ${{ always() && steps.validate-supply-chain-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: |
            source/.verify/supply-chain/workflow-provenance.json
            source/.verify/supply-chain/npm-audit.json
            source/.verify/supply-chain/npm-audit-production.json
            source/.verify/supply-chain/npm-audit-summary.json
            source/.verify/supply-chain/sbom.cdx.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Fast quality gates
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.12.1
      - name: Install workspace dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint workspaces
        run: npm run lint
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Run fast tests
        run: npm run test:fast
      - name: Build workspaces
        run: npm run build

  e2e:
    name: End-to-end gate
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.12.1
      - name: Install workspace dependencies
        run: npm ci
      - name: Install repository-pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run explicit E2E suite
        run: npm run test:e2e
      - name: Upload retained E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-diagnostics
          path: .verify/e2e-failures
          if-no-files-found: ignore
          retention-days: 14
