name: dev-learning-harness

services:
  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    environment:
      HOST: 0.0.0.0
      # Wildcard binding is container-internal; host publication stays loopback-only.
      ORCHESTRATOR_BIND_MODE: container-loopback-published
      PORT: 8787
      WEB_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: /data/dev-learning-harness.sqlite
      WORKSPACE_ROOT: /app/workspaces/exercises
      EXERCISE_ATTEMPTS_ROOT: /app/.data/exercise-attempts
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      ZED_EXECUTABLE: zed
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - harness-data:/data
      - harness-attempts:/app/.data
      - ./workspaces/exercises:/app/workspaces/exercises
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        ORCHESTRATOR_URL: http://orchestrator:8787
        ORCHESTRATOR_BIND_MODE: container-loopback-published
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8787
      ORCHESTRATOR_BIND_MODE: container-loopback-published
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  harness-data:
  harness-attempts:
